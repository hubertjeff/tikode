<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tikode | My todos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <h1>My todos</h1>

        <form id="todoForm" class="row">
            <input id="todoInput" placeholder="What do you need to do?" />
            <button type="submit">Add</button>
        </form>

        <ul id="todoList"></ul>

        <button id="logoutBtn" class="secondary">Log out</button>
    </div>

    <script src="todos.js"></script>
</body>
</html>
